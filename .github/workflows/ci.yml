name: CI

on:
  # PR 作成時に、Lambda/CDK の Python コードが壊れていないか確認する。
  pull_request:
  # main に入った変更だけを本番デプロイ候補にする。
  push:
    branches:
      - main
  # 手動実行も残し、main 反映後の確認や再実行に使えるようにする。
  workflow_dispatch:

permissions:
  # テストだけなので repository contents の読み取り権限に限定する。
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        # pytest で通らない import 時エラーや構文エラーを早めに検出する。
        run: python -m compileall app.py infra lambda tests

      - name: Run tests
        # domain/application/infrastructure の主要な回帰テストを実行する。
        run: python -m pytest -q

  deploy:
    name: CDK deploy
    needs: test
    runs-on: ubuntu-latest
    # Environment を使うことで、OIDC の sub claim と本番用 Secrets/Variables を固定する。
    environment: production
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    permissions:
      # GitHub OIDC で AWS の一時認証情報を取得するために必要。
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEPLOY_REGION: ${{ vars.AWS_REGION }}
      # カテゴリHTMLに出ない短時間入荷を拾うため、重要なGM/TGM商品URLを直接seedに足す。
      SEED_URLS: >-
        ${{ vars.SEED_URLS }},
        https://www.hermes.com/jp/ja/product/%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AC%E3%83%83%E3%83%88-%E3%80%8A%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%80%E3%83%B3%E3%82%AF%E3%83%AB%E3%80%8B-gm-H101672Bv00011/,
        https://www.hermes.com/jp/ja/product/%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AC%E3%83%83%E3%83%88-%E3%80%8A%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%80%E3%83%B3%E3%82%AF%E3%83%AB%E3%80%8B-tgm-H101995Bv00009/,
        https://www.hermes.com/jp/ja/product/%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AC%E3%83%83%E3%83%88-%E3%80%8A%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%80%E3%83%B3%E3%82%AF%E3%83%AB%E3%80%8B-tgm-H101995Bv00010/,
        https://www.hermes.com/jp/ja/product/%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AC%E3%83%83%E3%83%88-%E3%80%8A%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%80%E3%83%B3%E3%82%AF%E3%83%AB%E3%80%8B-tgm-H101995Bv00011/,
        https://www.hermes.com/jp/ja/product/%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AC%E3%83%83%E3%83%88-%E3%80%8A%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%80%E3%83%B3%E3%82%AF%E3%83%AB%E3%80%8B-tgm-H101995Bv00012/,
        https://www.hermes.com/jp/ja/product/%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AC%E3%83%83%E3%83%88-%E3%80%8A%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%80%E3%83%B3%E3%82%AF%E3%83%AB%E3%80%8B-tgm-H101995Bv00013/,
        https://www.hermes.com/jp/ja/product/%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AC%E3%83%83%E3%83%88-%E3%80%8A%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%80%E3%83%B3%E3%82%AF%E3%83%AB%E3%80%8B-tgm-H101995Bv00014/
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
      NOTIFICATION_TIMEZONE: ${{ vars.NOTIFICATION_TIMEZONE }}
      SCHEDULE_MINUTES: ${{ vars.SCHEDULE_MINUTES }}
      TARGET_KEYWORDS: ${{ vars.TARGET_KEYWORDS }}
      TARGET_SIZES: ${{ vars.TARGET_SIZES }}
      NOTIFY_ON_FIRST_AVAILABLE: ${{ vars.NOTIFY_ON_FIRST_AVAILABLE }}
      PAGE_LIMIT: ${{ vars.PAGE_LIMIT }}
      FETCH_DELAY_MS: ${{ vars.FETCH_DELAY_MS }}
      NOTIFICATION_PHONE_NUMBER: ${{ secrets.NOTIFICATION_PHONE_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "870574718611"
          role-session-name: hermes-notification-cdk-deploy

      - name: Synthesize CDK
        # deploy 前に template 生成を明示して、環境変数不足を早めに検出する。
        run: npx -y aws-cdk@latest synth HermesNotificationChaineDancreStack

      - name: Deploy CDK stack
        # CDK 管理下のLambda/IAM/EventBridge/SNS/DynamoDBを差分更新する。
        run: |
          npx -y aws-cdk@latest deploy HermesNotificationChaineDancreStack \
            --require-approval never \
            --outputs-file cdk-outputs.json
